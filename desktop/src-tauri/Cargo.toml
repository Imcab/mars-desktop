[package]
name = "mars-desktop"
version = "1.1.4"
description = "MARS Desktop - a NetworkTables dashboard for FRC"
authors = ["STZ Robotics"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mars_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# --- Editions --------------------------------------------------------------
#
# `mars` (on by default) brings the framework: subsystem and feature
# generation, the Java source map, and the Simulation Studio launcher.
#
# The Tools edition is built with `--no-default-features` and compiles none of
# it: it is the NetworkTables app on its own. See src/mars/README.md.
[features]
default = ["mars"]

# MANDATORY for a production build. `tauri::is_dev()` is literally
# `!cfg!(feature = "custom-protocol")`: without it the binary loads the
# interface from devUrl (localhost:1420) instead of the embedded bundle, and
# all you see when opening it is the webview's connection error. Tauri's CLI
# turns it on by itself during `tauri build`; a plain `cargo build --release`
# does NOT, and that is the path scripts/package-release.mjs uses.
custom-protocol = ["tauri/custom-protocol"]
# `regex` is only used by the Java source map and by reading the Manifest, both
# of which belong to the framework: in the Tools edition it is neither
# downloaded nor compiled.
mars = ["dep:regex"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
dirs = "5"
regex = { version = "1.12.4", optional = true }
base64 = "0.22"   # exportar el PNG del gráfico, que viaja como data URL

# Descarga e instalación de los assets 3D del Field 3D. Van en Rust y no en el
# front porque GitHub no manda cabeceras CORS en sus releases: un `fetch` desde
# el webview falla siempre, sin importar la CSP.
#
# rustls con las raíces del SISTEMA a propósito: muchos equipos trabajan detrás
# del proxy de su escuela, que reemplaza los certificados por los suyos. Con las
# raíces embebidas de webpki, toda descarga fallaría ahí.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "charset", "http2", "system-proxy"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Dependencias de red y asincronía (NT4)
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Serialización y formatos de datos
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1" # Para leer y escribir MessagePack binario
rmpv = { version = "1.3.1", features = ["with-serde"] }
