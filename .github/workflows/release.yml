# Publishes a release with the executables for all three platforms.
# Fires when a `vX.Y.Z` tag is pushed, or by hand from the Actions tab.
#
# It exists because you CANNOT build for all three platforms from one of them:
# Tauri links against the system webview (WebView2 on Windows, WebKitGTK on
# Linux, WKWebView on macOS), so every executable has to be built on its own
# operating system. Hence one job per platform on its own runner, with
# `manifest.json` assembled at the end, once every archive exists.

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the v). Empty = the one in version.ts"
        required: false

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing has no business taking the others down: a release
      # with two out of three is useful, and the installer says what is missing.
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-latest
          # 22.04 rather than the latest: it pins an older glibc, and a binary
          # linked against a newer one will not run on older distros, whereas
          # the other way round works fine.
          - name: Linux x86_64
            runner: ubuntu-22.04
          # A single macOS runner produces BOTH architectures: the system SDK is
          # universal and Rust crosses between them with a `--target`. There used
          # to be a `macos-13` job for Intel, but that runner no longer exists:
          # the job sat queued forever and, since the publishing job depends on
          # ALL of the matrix, the release never came out.
          - name: macOS (arm64 + x86_64)
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer
            sim/app
            sim/bridge

      # Tauri on Linux links against WebKitGTK and libsoup. Without this the
      # build fails inside `pkg-config` with an error that never mentions Tauri.
      #
      # This is exactly Tauri v2's list of prerequisites, not one package more:
      # the old `libappindicator3-dev` and `libayatana-appindicator3-dev`
      # EXCLUDE each other, and asking for both makes apt abort the whole
      # install. That is what killed the first attempt.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: npm ci

      - name: Check the version is in sync
        run: node scripts/sync-version.mjs

      - run: npm test

      # The Simulation Studio's engine is C++ against Gazebo, and Gazebo comes
      # from conda: there is no wheel, no vendored copy and no way around it.
      # Without this the packager REFUSES to publish the Studio (see
      # `stageSimBinaries`) and the release goes out with the dashboard only --
      # which is exactly what shipped before: an install whose Diagnostics page
      # was three FAILs, on a machine with no compiler to fix them.
      #
      # It is the slowest step of the job (the environment is about 2 GB) and
      # it only runs on Windows because that is the only platform where the
      # engine is built today.
      - name: Gazebo toolchain (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: sim/environment.yml
          activate-environment: mars-sim
          # Solving Gazebo's dependency tree with plain conda is the difference
          # between a couple of minutes and a quarter of an hour.
          use-mamba: true

      # `pwsh -l` so the profile setup-miniconda wrote runs and CONDA_PREFIX
      # points at mars-sim; build.ps1 and the bridge both find the environment
      # through it. MSVC is already on the runner, which is what build.ps1
      # needs on top of conda.
      - name: Build the simulation engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh -l {0}
        run: |
          # A custom shell does not get the `stop` preference and the exit-code
          # check that GitHub injects into its own `pwsh` shell, so a failed
          # build here would go green. Both are set by hand.
          $ErrorActionPreference = "Stop"
          if (-not $env:CONDA_PREFIX) { throw "the mars-sim environment is not active" }
          ./sim/build.ps1
          # gz-transport-sys resolves the C++ libraries through pkg-config, the
          # same way sim/verify.ps1 does it.
          $env:PKG_CONFIG_PATH = "$env:CONDA_PREFIX\Library\lib\pkgconfig"
          $env:PATH = "$env:CONDA_PREFIX\Library\bin;$env:PATH"
          cargo build --release --manifest-path sim/bridge/Cargo.toml --bins
          if ($LASTEXITCODE -ne 0) { throw "the bridge build failed" }

      - name: Build and package
        run: node scripts/package-release.mjs

      # macOS' second architecture, crossed from the same machine. `--arch`
      # gives the archives the right names; the installer works out on its own
      # which one applies to it.
      - name: Also package macOS x86_64
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          node scripts/package-release.mjs --arch x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.runner }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    # A dispatch from a test branch must NOT publish. This job has no trigger of
    # its own: it runs whenever `package` finishes, including the manual runs
    # used to try a change out on a branch. And it does not publish a draft --
    # with `draft: false` and a `tag_name` that falls back to `v<version>`, a
    # run from a branch would CREATE that tag and the release, on that branch's
    # commit, and the installer serves the latest release the moment it exists.
    #
    # So: tags publish, `main` publishes when it is dispatched by hand (that is
    # what the `version` input is for), and any other branch stops at the
    # artifacts, which is all a test run needs.
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: downloads

      # Artifacts come down in one folder per job; the release wants them flat
      # and with a single VERSION.
      - name: Collect the archives
        run: |
          mkdir -p release
          find downloads -type f ! -name VERSION -exec cp -n {} release/ \;
          ls -la release

      - name: Write the manifest
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oP 'MARS_VERSION\s*=\s*"\K[^"]+' src/constants/version.ts)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/make-manifest.mjs release "$VERSION"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          name: MARS ${{ env.VERSION }}
          # The installer reads the latest NON-draft release: publishing as a
          # draft would leave it saying "there is no release" with no
          # explanation.
          draft: false
          generate_release_notes: true
          files: release/*
          body: |
            ## Installing

            Download the installer for your system and run it. It fetches the rest.

            | System | File |
            |---|---|
            | **Windows** (recommended) | `MARS-Installer.exe` |
            | Linux | `MARS-Installer-linux-x86_64` |
            | macOS | `MARS-Installer-macos-aarch64` (Apple Silicon) or `-x86_64` (Intel) |

            On Linux and macOS make it executable first: `chmod +x MARS-Installer-*`.

            The installer lets you choose between **Complete MARS** (the whole
            ecosystem) and **Tools only** (the NetworkTables dashboard, without
            the framework), and it also uninstalls.

            The `.zip` and `.tar.gz` files listed here are what the installer
            downloads: there is no need to fetch them by hand.
