# MARS Installer: the app that installs, updates and uninstalls the MARS
# ecosystem on the team's machine.
#
# It deliberately shares no workspace with mars-desktop or with the Studio: it
# has to be buildable and publishable without touching any of the products it
# installs, and above all it has to OUTLIVE them --- it stays on disk after the
# installation so it can uninstall.
#
# It carries no node toolchain. Its UI is plain ES modules in ui/, like the
# Simulation Studio: an installer that dragged a bundler along for five screens
# would weigh more than what it installs.
[package]
name = "mars-installer"
version = "1.0.0"
description = "Installer for MARS Desktop and its ecosystem"
authors = ["STZ Robotics"]
edition = "2021"

# See the note in src-tauri/Cargo.toml: without `custom-protocol`,
# `tauri::is_dev()` returns true and the binary does not serve the embedded UI.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# The same TLS setup as mars-desktop and for the same reason: many teams work
# behind their school's proxy, which replaces the certificates. With webpki's
# embedded roots every download would fail there. `stream` is what makes it
# possible to report progress while downloading.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "charset", "http2", "system-proxy", "stream", "json"] }

# Archive formats are chosen per platform, so the libraries are too: the
# Windows installer will never open a .tar.gz, and vice versa.
[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
winreg = "0.52"

[target.'cfg(not(windows))'.dependencies]
tar = "0.4"
flate2 = "1"

# The installer ships as ONE executable that people download over the internet:
# every MB counts and there is no incremental build to optimise for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
