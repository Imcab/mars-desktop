# MARS Simulation Studio: la aplicacion de simulacion, aparte de mars-desktop.
#
# No comparte workspace con la app ni con el bridge a proposito. Es un producto
# distinto, con su propio ciclo de vida: la simulacion se puede reinstalar o
# romper sin tocar el dashboard que el equipo usa en competencia.
#
# No lleva toolchain de node. Su UI es un panel de control de una sola pagina
# estatica en ui/, asi que se compila con cargo y nada mas. El dashboard con
# graficas y campo 3D ya existe --- es mars-desktop, y recibe los datos de esta
# simulacion por NT4 igual que de un robot real.
[package]
name = "mars-sim-app"
# Acompana a MSS_VERSION de ui/js/constants.js: esta es la que acaba en el
# ejecutable y en el instalador; aquella, la que se ve en la interfaz.
version = "0.9.4"
edition = "2021"

# Ver la nota en src-tauri/Cargo.toml: sin `custom-protocol` el binario queda
# en modo desarrollo. Aca no rompia porque este tauri.conf.json no declara
# devUrl, pero depender de esa casualidad no es una estrategia.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
