# El bridge de simulación: traduce entre gz-transport (el motor), HALSim
# WebSocket (el código del robot) y NT4 (la app). Ver sim/protocol/README.md.
#
# Crate independiente a propósito, fuera del workspace de src-tauri: el bridge
# se compila y distribuye como binario aparte, y meterlo al workspace de la app
# haría que un `cargo build` de Tauri arrastre las dependencias de Gazebo.
#
# Para compilar hace falta el entorno conda `mars-sim` (por las libs de
# gz-transport) y PKG_CONFIG_PATH apuntando a su pkgconfig. Ver README.md.
[package]
name = "mars-sim-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
# Envoltorio FFI del gz-transport de C++. Se eligió sobre `gz-transport-rs`
# (implementación pura en Rust) porque el publish de ese crate anuncia
# tcp://0.0.0.0, que no es conectable, y el motor nunca recibe los comandos.
# El detalle completo está en README.md.
#
# El coste del FFI resultó ser cero en la práctica: el motor obliga a
# distribuir el entorno conda de todas formas, así que enlazar contra sus libs
# no añade ninguna dependencia nueva en tiempo de ejecución.
gz-transport = { version = "0.10", features = ["jetty"] }
gz-msgs = { version = "0.10", features = ["jetty"] }

crossbeam-channel = "0.5"   # el tipo del canal que devuelve subscribe_channel
anyhow = "1"

# NT4: websocket + MessagePack. Las mismas versiones que usa src-tauri, para que
# el dia que se unifique el cliente no haya que reconciliar dependencias.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
rmp-serde = "1.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
# Para leer sim/protocol/topics.toml y generar las constantes del protocolo.
toml = "0.8"
